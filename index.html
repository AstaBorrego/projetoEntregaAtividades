<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Entregas Acadêmicas</title>
  
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <link rel="icon" type="image/png" href="logoavancatech.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- TELA INICIAL -->
    <div id="homeScreen" class="screen active">
      <h1>Portal de Entregas Acadêmicas</h1>
      <p class="subtitle">Selecione o seu perfil de acesso abaixo:</p>
      <div class="btn-group-home">
        <button class="btn btn-primary" onclick="showScreen('studentScreen')">Sou Aluno</button>
        <button class="btn btn-secondary" onclick="showScreen('loginScreen')">Sou Professor</button>
      </div>
    </div>

    <!-- TELA DO ALUNO -->
    <div id="studentScreen" class="screen">
      <h2>Envio de Atividade</h2>
      <div id="studentMsg" class="message"></div>
      <form id="studentForm" novalidate>
        
        <div class="form-group" id="group-nomeAluno">
          <label for="nomeAluno">Nome do Aluno *:</label>
          <input type="text" id="nomeAluno" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group" id="group-emailAluno">
          <label for="emailAluno">E-mail do Aluno *:</label>
          <input type="email" id="emailAluno" placeholder="aluno@escola.com" required>
        </div>

        <!-- POLOS 1 ATE 7 -->
        <div class="form-group" id="group-polo">
          <label>Selecione o Polo *:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="polo" value="Polo 1" required> Polo 1</label>
            <label class="radio-label"><input type="radio" name="polo" value="Polo 2" required> Polo 2</label>
            <label class="radio-label"><input type="radio" name="polo" value="Polo 3" required> Polo 3</label>
            <label class="radio-label"><input type="radio" name="polo" value="Polo 4" required> Polo 4</label>
            <label class="radio-label"><input type="radio" name="polo" value="Polo 5" required> Polo 5</label>
            <label class="radio-label"><input type="radio" name="polo" value="Polo 6" required> Polo 6</label>
            <label class="radio-label"><input type="radio" name="polo" value="Polo 7" required> Polo 7</label>
          </div>
        </div>

        <!-- DIAS DE AULA -->
        <div class="form-group" id="group-diasAula">
          <label>Dias de Aula *:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="diasAula" value="Seg. / Qua." required> Seg. / Qua.</label>
            <label class="radio-label"><input type="radio" name="diasAula" value="Ter. / Qui." required> Ter. / Qui.</label>
            <label class="radio-label"><input type="radio" name="diasAula" value="Todos os dias" required> Todos os dias</label>
          </div>
        </div>

        <div class="form-group" id="group-turno">
          <label>Selecione o Turno *:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="turno" value="Manhã" required> Manhã</label>
            <label class="radio-label"><input type="radio" name="turno" value="Tarde" required> Tarde</label>
            <label class="radio-label"><input type="radio" name="turno" value="Noite" required> Noite</label>
          </div>
        </div>

        <div class="form-group" id="group-modulo">
          <label>Selecione o Módulo *:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="modulo" value="Módulo 1" required> Módulo 1</label>
            <label class="radio-label"><input type="radio" name="modulo" value="Módulo 2" required> Módulo 2</label>
            <label class="radio-label"><input type="radio" name="modulo" value="Módulo 3" required> Módulo 3</label>
          </div>
        </div>

        <div class="form-group" id="group-tipoAvaliacao">
          <label>Selecione o Tipo de Avaliação *:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="tipoAvaliacao" value="Atividade" required checked> Atividade</label>
            <label class="radio-label"><input type="radio" name="tipoAvaliacao" value="Prova" required> Prova</label>
            <label class="radio-label"><input type="radio" name="tipoAvaliacao" value="TCC" required> TCC</label>
          </div>
        </div>

        <div class="form-group" id="group-tituloTrabalho">
          <label for="tituloTrabalho">Título do Trabalho *:</label>
          <input type="text" id="tituloTrabalho" placeholder="Digite o título do seu trabalho" required>
        </div>

        <div class="form-group" id="group-descricao">
          <label for="descricao">Observação / Descrição da Atividade *:</label>
          <textarea id="descricao" rows="6" placeholder="Descreva aqui os detalhes da atividade..." required></textarea>
        </div>

        <div class="form-group" id="group-urlTrabalho">
          <label for="urlTrabalho">Link do Trabalho *:</label>
          <input type="url" id="urlTrabalho" placeholder="Insira o link do trabalho" required>
        </div>

        <div class="form-group" id="group-arquivoTrabalho">
          <label for="arquivoTrabalho">Enviar Arquivo Local (PDF, ZIP, Imagem, Doc):</label>
          <input type="file" id="arquivoTrabalho">
        </div>

        <div class="btn-actions">
          <button type="submit" class="btn btn-primary btn-flex">Enviar Atividade</button>
          <button type="button" class="btn btn-outline" onclick="showScreen('homeScreen')">Voltar</button>
        </div>
      </form>
    </div>

    <!-- TELA DE LOGIN DO PROFESSOR -->
    <div id="loginScreen" class="screen">
      <h2>Área do Professor - Login</h2>
      <div id="loginMsg" class="message"></div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="profEmail">E-mail:</label>
          <input type="email" id="profEmail" placeholder="professor@escola.com" required>
        </div>
        <div class="form-group">
          <label for="profPassword">Senha:</label>
          <input type="password" id="profPassword" placeholder="******" required>
        </div>
        <div class="btn-actions">
          <button type="submit" class="btn btn-primary btn-flex">Entrar</button>
          <button type="button" class="btn btn-outline" onclick="showScreen('homeScreen')">Voltar</button>
        </div>
      </form>
    </div>

    <!-- TELA DE PAINEL DO PROFESSOR -->
    <div id="teacherDashboard" class="screen">
      <h2>Painel do Professor - Avaliação e Edição</h2>
      <div id="teacherMsg" class="message"></div>

      <form id="teacherForm">
        
        <div class="form-group">
          <label for="selectAluno">Selecione o Aluno (Consulta):</label>
          <select id="selectAluno">
            <option value="">-- Selecione um Aluno --</option>
          </select>
        </div>

        <!-- ÁREA ONDE SURGEM OS TRABALHOS DO ALUNO SELECIONADO -->
        <div class="form-group" id="areaTrabalhosAluno" style="display: none;">
          <label>Trabalhos Entregues por este Aluno (Clique para Avaliar):</label>
          <div id="listaTrabalhosAluno" class="lista-trabalhos-container"></div>
        </div>

        <div class="form-group">
          <label for="profEmailAluno">E-mail do Aluno:</label>
          <input type="email" id="profEmailAluno" placeholder="aluno@escola.com">
        </div>

        <!-- POLO PROFESSOR 1 ATE 7 -->
        <div class="form-group">
          <label>Polo do Aluno:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="profPolo" value="Polo 1"> Polo 1</label>
            <label class="radio-label"><input type="radio" name="profPolo" value="Polo 2"> Polo 2</label>
            <label class="radio-label"><input type="radio" name="profPolo" value="Polo 3"> Polo 3</label>
            <label class="radio-label"><input type="radio" name="profPolo" value="Polo 4"> Polo 4</label>
            <label class="radio-label"><input type="radio" name="profPolo" value="Polo 5"> Polo 5</label>
            <label class="radio-label"><input type="radio" name="profPolo" value="Polo 6"> Polo 6</label>
            <label class="radio-label"><input type="radio" name="profPolo" value="Polo 7"> Polo 7</label>
          </div>
        </div>

        <!-- DIAS DE AULA PROFESSOR -->
        <div class="form-group">
          <label>Dias de Aula:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="profDiasAula" value="Seg. / Qua."> Seg. / Qua.</label>
            <label class="radio-label"><input type="radio" name="profDiasAula" value="Ter. / Qui."> Ter. / Qui.</label>
            <label class="radio-label"><input type="radio" name="profDiasAula" value="Todos os dias"> Todos os dias</label>
          </div>
        </div>

        <div class="form-group">
          <label>Turno do Aluno:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="profTurno" value="Manhã"> Manhã</label>
            <label class="radio-label"><input type="radio" name="profTurno" value="Tarde"> Tarde</label>
            <label class="radio-label"><input type="radio" name="profTurno" value="Noite"> Noite</label>
          </div>
        </div>

        <div class="form-group">
          <label>Módulo do Aluno:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="profModulo" value="Módulo 1"> Módulo 1</label>
            <label class="radio-label"><input type="radio" name="profModulo" value="Módulo 2"> Módulo 2</label>
            <label class="radio-label"><input type="radio" name="profModulo" value="Módulo 3"> Módulo 3</label>
          </div>
        </div>

        <div class="form-group">
          <label>Tipo de Avaliação:</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="profTipoAvaliacao" value="Atividade"> Atividade</label>
            <label class="radio-label"><input type="radio" name="profTipoAvaliacao" value="Prova"> Prova</label>
            <label class="radio-label"><input type="radio" name="profTipoAvaliacao" value="TCC"> TCC</label>
          </div>
        </div>

        <div class="form-group">
          <label for="profTituloTrabalho">Título do Trabalho:</label>
          <input type="text" id="profTituloTrabalho" placeholder="Título do trabalho enviado">
        </div>

        <div class="form-group">
          <label for="profDescricao">Observação / Descrição da Atividade:</label>
          <textarea id="profDescricao" rows="4" placeholder="Descreva aqui os detalhes da atividade..."></textarea>
        </div>

        <div class="form-group">
          <label for="profUrlTrabalho">Link do Trabalho:</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="url" id="profUrlTrabalho" placeholder="Nenhum link fornecido">
            <button type="button" id="btnAbrirLink" class="btn btn-secondary">Abrir</button>
          </div>
        </div>

        <div class="form-group">
          <label>Arquivo Enviado pelo Aluno:</label>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <input type="text" id="profNomeArquivo" readonly placeholder="Nenhum arquivo anexado">
            <button type="button" id="btnBaixarArquivo" class="btn btn-secondary" style="display: none;">Baixar / Abrir</button>
          </div>
        </div>

        <!-- NOTA ENTRE 7 E 10 -->
        <div class="form-group">
          <label for="profNota">Nota do Aluno (Nota mínima 7.0 / máxima 10.0):</label>
          <input type="number" id="profNota" min="7" max="10" step="0.1" placeholder="Atribua uma nota de 7.0 a 10.0">
        </div>

        <div class="form-group">
          <label for="profComentario">Comentários / Feedback para o Aluno:</label>
          <textarea id="profComentario" rows="4" placeholder="Escreva o feedback ou observações sobre o trabalho..."></textarea>
        </div>

        <div class="btn-actions no-print">
          <button type="button" id="btnSalvarNota" class="btn btn-primary">Salvar Alterações e Enviar E-mail</button>
          <button type="button" id="btnImprimirSelecionado" class="btn btn-secondary">Imprimir Aluno Selecionado</button>
        </div>

      </form>

      <hr style="margin: 2rem 0;">

      <p class="subtitle">Ou selecione opções para gerar relatório de impressão geral (1 página por aluno):</p>
      
      <div class="form-group">
        <label for="tipoImpressao">Tipo de Impressão Geral:</label>
        <select id="tipoImpressao">
          <option value="todos">Todas as Atividades (Por Aluno)</option>
          <option value="polo">Filtrar por Polo</option>
        </select>
      </div>

      <div class="form-group" id="grupoSelectPolo" style="display: none;">
        <label for="selectPoloFiltro">Selecione o Polo:</label>
        <select id="selectPoloFiltro">
          <option value="Polo 1">Polo 1</option>
          <option value="Polo 2">Polo 2</option>
          <option value="Polo 3">Polo 3</option>
          <option value="Polo 4">Polo 4</option>
          <option value="Polo 5">Polo 5</option>
          <option value="Polo 6">Polo 6</option>
          <option value="Polo 7">Polo 7</option>
        </select>
      </div>

      <div class="btn-actions no-print">
        <button type="button" id="btnImprimirGeral" class="btn btn-primary">Imprimir Relatório Geral</button>
        <button type="button" class="btn btn-outline" onclick="showScreen('homeScreen')">Sair</button>
      </div>

      <div id="printArea"></div>
    </div>

  </div>

  <div id="modalSucesso" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h3>Envio Concluído!</h3>
      <p id="modalMensagemIncentivo"></p>
      <button type="button" class="btn btn-primary" onclick="fecharModalSucesso()">OK</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
